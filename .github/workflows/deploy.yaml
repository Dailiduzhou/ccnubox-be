name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'be-ccnu/**'
      - 'be-class_v2/**'
      - 'be-classlist/**'
      - 'be-content/**'
      - 'be-counter/**'
      - 'be-elecprice/**'
      - 'be-feed/**'
      - 'be-grade/**'
      - 'be-library/**'
      - 'be-proxy/**'
      - 'be-user/**'
      - 'bff/**'
      - 'common/**'
      - '.github/workflows/deploy.yaml'

permissions:
  contents: read

# Only the latest waiting main-branch revision is relevant for deployment. The
# active revision is never cancelled, and every service selected within it is
# deployed by the serial matrix below.
concurrency:
  group: ccnubox-dev-deploy
  cancel-in-progress: false

jobs:
  changes:
    if: github.repository == 'asynccnu/ccnubox-be'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
      version: ${{ steps.version.outputs.id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select services
        id: services
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          all_services=(
            be-ccnu
            be-class_v2
            be-classlist
            be-content
            be-counter
            be-elecprice
            be-feed
            be-grade
            be-library
            be-proxy
            be-user
            bff
          )

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            changed_files="$(git ls-tree -r --name-only "$GITHUB_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          fi

          deploy_all=false
          while IFS= read -r file; do
            case "$file" in
              common/*|.github/workflows/deploy.yaml)
                deploy_all=true
                ;;
            esac
          done <<< "$changed_files"

          selected_services=()
          for service in "${all_services[@]}"; do
            if [[ "$deploy_all" == true ]] || grep -q "^${service}/" <<< "$changed_files"; then
              selected_services+=("$service")
            fi
          done

          if ((${#selected_services[@]} == 0)); then
            services_json='[]'
          else
            services_json="$(printf '%s\n' "${selected_services[@]}" | jq -R . | jq -sc .)"
          fi
          echo "services=$services_json" >> "$GITHUB_OUTPUT"

      - name: Get commit id
        id: version
        run: echo "id=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    if: needs.changes.outputs.services != '[]'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to Aliyun Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          registry: ${{ secrets.ALIYUN_REGISTRY }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/ccnubox-${{ matrix.service }}:${{ needs.changes.outputs.version }}
          build-args: ${{ matrix.service == 'be-user' && format('KEY={0}', secrets.CRYPTO_KEY) || '' }}

  deploy:
    if: needs.changes.outputs.services != '[]'
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Set up SSH key
        env:
          DEV_SERVER: ${{ secrets.DEV_SERVER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEV_SERVER" >> ~/.ssh/known_hosts

      - name: Deploy ${{ matrix.service }}
        env:
          DEV_SERVER: ${{ secrets.DEV_SERVER }}
          DEV_SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
          REGISTRY_USER: ${{ secrets.ALIYUN_USERNAME }}
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail

          registry_b64="$(printf '%s' "$REGISTRY" | base64 -w 0)"
          registry_user_b64="$(printf '%s' "$REGISTRY_USER" | base64 -w 0)"
          registry_password_b64="$(printf '%s' "$REGISTRY_PASSWORD" | base64 -w 0)"

          {
            printf "SERVICE='%s'\n" "$SERVICE"
            printf "VERSION='%s'\n" "$VERSION"
            printf "REGISTRY_B64='%s'\n" "$registry_b64"
            printf "REGISTRY_USER_B64='%s'\n" "$registry_user_b64"
            printf "REGISTRY_PASSWORD_B64='%s'\n" "$registry_password_b64"
            cat << 'REMOTE_SCRIPT'
          set -euo pipefail
          cd ~/ccnubox_v3

          REGISTRY="$(printf '%s' "$REGISTRY_B64" | base64 -d)"
          REGISTRY_USER="$(printf '%s' "$REGISTRY_USER_B64" | base64 -d)"
          REGISTRY_PASSWORD="$(printf '%s' "$REGISTRY_PASSWORD_B64" | base64 -d)"

          (
            flock -x 200
            touch .env

            echo "$REGISTRY_PASSWORD" | docker login \
              --username="$REGISTRY_USER" \
              --password-stdin \
              "$REGISTRY"

            KEY="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')"
            if grep -q "^${KEY}=" .env; then
              sed -i "s/^${KEY}=.*/${KEY}=${VERSION}/" .env
            else
              echo "${KEY}=${VERSION}" >> .env
            fi

            docker compose pull "$SERVICE"
            docker compose up -d "$SERVICE"
            docker image prune -a -f --filter "until=24h"
          ) 200>/tmp/ccnubox_deploy.lock
          REMOTE_SCRIPT
          } | ssh -o StrictHostKeyChecking=no "$DEV_SERVER_USER@$DEV_SERVER" bash -s
