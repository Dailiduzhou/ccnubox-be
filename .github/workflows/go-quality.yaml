name: Go Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - be-ccnu
          - be-class
          - be-classlist
          - be-content
          - be-counter
          - be-elecprice
          - be-feed
          - be-grade
          - be-library
          - be-proxy
          - be-user
          - bff
          - common

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
