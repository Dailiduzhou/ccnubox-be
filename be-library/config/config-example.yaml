log:
  path: "/logs/app.log"
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  compress: 1

otel:
  serviceName: "be-library"
  serviceVersion: "1.0.0"
  endpoint: "localhost:4318"

crypto:
  secret: ""  # 仅供旧 crawler 迁移兼容；提醒模块动态获取 HMAC key

# 默认关闭，旧部署不添加此段也不会启动提醒 worker 或连接 Feed。
libraryReminder:
  enabled: false
  preferenceSyncInterval: 15s
  preferenceFullSyncCron: "15 3 * * *"
  fullRefreshCron: "*/30 * * * *"
  fullRefreshMinInterval: 25m
  activeScanCron: "*/5 * * * *"
  activeScanMinInterval: 4m
  jobDispatchCron: "* * * * *"
  outboxInterval: 2s
  userConcurrency: 20
  userJitter: 250ms
  upstreamRetryAttempts: 3
  upstreamQPS: 20
  requestTimeout: 8s
  historyPageSize: 20
  historyLookbackDays: 3
  retryMaxAttempts: 10
  baselineOnEnable: true
  dryRun: true
  notificationTypes:
    reservationDiscovered: true
    start30: true
    end10: true
    away60: true
    away80: true
    breach: true
    blacklisted: true
